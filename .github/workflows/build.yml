name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Create google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "goalwicket-dummy",
              "storage_bucket": "goalwicket-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {"package_name": "com.aistudio.goalwicket.live"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GoalWicket-APK
          path: app/build/outputs/apk/debug/*.apk
