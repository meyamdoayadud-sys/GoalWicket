
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"123","project_id":"goalwicket","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.example.goalwicket"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}]}}],"configuration_version":"1"}' > app/google-services.json
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GoalWicket-APK
          path: app/build/outputs/apk/debug/*.apk
